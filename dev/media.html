<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media harness</title>
    <style>
      :root { color-scheme: dark; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      body { margin: 0; padding: 16px; background: #0b0b0c; color: #e8e6df; display: grid; gap: 12px; }
      #drop { border: 1px dashed #555; padding: 16px; border-radius: 6px; }
      #drop.over { border-color: #3b5bdb; background: #11152a; }
      #transport { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      button, input { font: inherit; }
      #preview { max-width: 100%; max-height: 60vh; background: repeating-conic-gradient(#222 0 25%, #333 0 50%) 0 0 / 16px 16px; justify-self: start; }
      pre { margin: 0; white-space: pre-wrap; }
      .error { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div id="drop">Drop an image, GIF or video here, or <input id="file" type="file" /></div>
    <div id="transport" hidden>
      <button id="play">Play</button>
      <button id="back">◀ 1</button>
      <button id="fwd">1 ▶</button>
      <label><input id="loop" type="checkbox" checked /> loop</label>
      <label>in <input id="in" type="number" step="0.1" min="0" value="0" style="width: 6em" /></label>
      <label>out <input id="out" type="number" step="0.1" min="0" style="width: 6em" /></label>
      <span id="time"></span>
    </div>
    <canvas id="preview" width="1" height="1"></canvas>
    <pre id="info"></pre>
    <script type="module" src="./media.ts"></script>
  </body>
</html>
