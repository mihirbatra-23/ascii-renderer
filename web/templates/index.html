<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Renderer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ASCII Art Renderer</h1>
            <p class="subtitle">Drop an image to convert it to high-quality ASCII art using shape-vector matching</p>
        </header>

        <!-- Drop zone -->
        <div id="drop-zone" class="drop-zone">
            <div class="drop-zone-prompt">
                <div class="drop-icon">&#9655;</div>
                <p>Drag &amp; drop an image here, or paste (Ctrl+V)</p>
                <p class="small">or click to browse</p>
            </div>
            <img id="preview" class="preview hidden" alt="Preview">
            <input type="file" id="file-input" accept="image/*" hidden>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="max-width">Width (chars) <span class="info-icon" data-tooltip="Higher = more detail, wider output. Lower = simpler, narrower output.">&#9432;</span></label>
                <div class="slider-row">
                    <input type="range" id="max-width" min="40" max="200" value="120">
                    <span id="width-display" class="value-display">120</span>
                </div>
            </div>
            <div class="control-group">
                <label for="global-contrast">Global Contrast <span class="info-icon" data-tooltip="Higher = sharper distinction between light and dark areas. Lower = softer, more uniform appearance.">&#9432;</span></label>
                <div class="slider-row">
                    <input type="range" id="global-contrast" min="1.0" max="5.0" step="0.1" value="2.0">
                    <span id="gc-display" class="value-display">2.0</span>
                </div>
            </div>
            <div class="control-group">
                <label for="dir-contrast">Edge Sharpness <span class="info-icon" data-tooltip="Higher = crisper edges and boundaries. Lower = smoother, less defined edges.">&#9432;</span></label>
                <div class="slider-row">
                    <input type="range" id="dir-contrast" min="1.0" max="5.0" step="0.1" value="3.0">
                    <span id="dc-display" class="value-display">3.0</span>
                </div>
            </div>
            <button id="reset-btn" class="btn-secondary">Reset</button>
            <button id="render-btn" class="btn-primary" disabled>Render</button>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loading-text">Rendering ASCII art...</p>
        </div>

        <!-- Results -->
        <div id="results" class="results hidden">
            <div class="tabs">
                <button class="tab active" data-tab="text">Text</button>
                <button class="tab" data-tab="image">Image</button>
            </div>
            <div id="tab-text" class="tab-content active">
                <pre id="ascii-text"></pre>
            </div>
            <div id="tab-image" class="tab-content hidden">
                <img id="ascii-image" alt="ASCII Art PNG">
            </div>
            <div class="actions">
                <button id="copy-btn" class="btn-secondary">Copy Text</button>
                <button id="download-btn" class="btn-secondary">Download PNG</button>
                <button id="download-svg-btn" class="btn-secondary">Download SVG</button>
            </div>
            <div id="stats" class="stats"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
